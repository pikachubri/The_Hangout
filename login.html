<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Hangout | Login</title>
     <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel = "stylesheet" href="style.css">
</head>

<body class = "dark-page">

    <!-- NAVIGATION BAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand fw-bold text-success" href="index.html">The Hangout</a>
        
        <div>
            <a class ="nav-link d-inline text-light me-3"
            href="index.html">Home</a>

             <a class ="nav-link d-inline text-light me-3"
            href="browse.html">Browse</a>

             <a class ="nav-link d-inline text-light me-3"
            href="playlist.html">Playlist</a>

             <a class ="nav-link d-inline text-light me-3"
            href="about.html">About</a>

            <a href="login.html" id="authLink" class="btn btn-outline-light">Login</a>

             <a class ="btn btn-success ms-2 "
            href="register.html">Register</a>   
        </div>
      </div>
    </nav>

    <!-- Login Form -->
<main class="container my-5 text-light">
    <section class="text-center mb-5">
        <h1 class="fw-bold">Login</h1>
        <p class="lead">Access your The Hangout account</p>
    </section>

    <section class="row justify-content-center">
        <div class="col-md-6">
            <div class="card song-card">
                <div class="card-body">

                    <form id="loginForm" novalidate>

                        <!-- Email -->
                        <div class="mb-3">
                            <label for="loginEmail" class="form-label">Email</label>
                            <input type="email" class="form-control" id="loginEmail" required>
                            <div class="invalid-feedback">
                                Please enter a valid email.
                            </div>
                        </div>

                        <!-- Password -->
                        <div class="mb-3">
                            <label for="loginPassword" class="form-label">Password</label>
                            <input type="password" class="form-control" id="loginPassword" required>
                            <div class="invalid-feedback">
                                Password is required.
                            </div>
                        </div>

                        <!-- Error Message -->
                        <div id="loginError" class="alert alert-danger d-none">
                            Invalid email or password.
                        </div>

                        <!-- Success Message -->
                        <div id="loginSuccess" class="alert alert-success d-none">
                            Login successful! Redirecting...
                        </div>

                        <!-- Button -->
                        <button type="submit" class="btn btn-primary w-100">Login</button>

                    </form>

                </div>
            </div>
        </div>
    </section>
</main>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();

    let isValid = true;

    const email = document.getElementById("loginEmail");
    const password = document.getElementById("loginPassword");
    const errorMsg = document.getElementById("loginError");
    const successMsg = document.getElementById("loginSuccess");

    // Reset states
    document.querySelectorAll(".form-control").forEach(input => {
        input.classList.remove("is-invalid");
    });
    errorMsg.classList.add("d-none");
    successMsg.classList.add("d-none");

    // Basic validation
    if (!email.checkValidity()) {
        email.classList.add("is-invalid");
        isValid = false;
    }

    if (password.value.trim() === "") {
        password.classList.add("is-invalid");
        isValid = false;
    }

    if (!isValid) return;

    // Get stored users from register page
    const users = JSON.parse(localStorage.getItem("users")) || [];

    // Check credentials
    const storedUser = users.find(user =>
        user.email === email.value &&
        user.password === password.value
    );
    if (storedUser) {
        // Successful login

    // Mark user as logged in
    localStorage.setItem("isLoggedIn", "true");
    localStorage.setItem("loggedInUser", storedUser.username);

    successMsg.classList.remove("d-none");

    setTimeout(() => {
        window.location.href = "index.html";
    }, 1500);

} else {
    errorMsg.classList.remove("d-none");
}

});
</script>
        


         <!-- Footer -->

   <footer class ="bg-dark text-light text-center py-3 ">
    <p class = "mb-0">&copy; 2026 The Hangout. All rights reserved.</p>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src ="script.js"></script>

    <script>
const authLink = document.getElementById("authLink");

// Check login state
if (localStorage.getItem("isLoggedIn") === "true") {
    authLink.textContent = "Logout";
    authLink.href = "#";

    authLink.addEventListener("click", function(e) {
        e.preventDefault();

        // Clear session
        localStorage.removeItem("isLoggedIn");
        localStorage.removeItem("loggedInUser");

        // Redirect to home/login
        window.location.href = "index.html";
    });
}
</script>
    
</body>
</html>
